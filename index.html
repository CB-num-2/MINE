<div class="draggable-dot" data-color="red" style="position: absolute; left: 50px; top: 40px; width: 40px; height: 40px; background-color: red; border-radius: 50%; touch-action: none; z-index: 10;"></div>

<div class="draggable-dot" data-color="green" style="position: absolute; left: 440px; top: 40px; width: 40px; height: 40px; background-color: green; border-radius: 50%; touch-action: none; z-index: 10;"></div>
<div class="draggable-dot" data-color="green" style="position: absolute; left: 490px; top: 40px; width: 40px; height: 40px; background-color: green; border-radius: 50%; touch-action: none; z-index: 10;"></div>

<script>
    let activeDot = null;

    function updateGame() {
        const boxes = document.querySelectorAll('.storage-box');
        
        boxes.forEach(box => {
            const boxId = box.getAttribute('data-box-id');
            const boxLeft = parseInt(box.style.left) || 0;
            const boxTop = parseInt(box.style.top) || 0;
            const boxWidth = parseInt(box.style.width) || 140;
            const boxHeight = parseInt(box.style.height) || 140;

            const storedDots = Array.from(document.querySelectorAll('.draggable-dot[data-stored-in="' + boxId + '"]'));
            
            let counts = { red: 0, blue: 0, green: 0 };
            storedDots.forEach(dot => {
                const color = dot.getAttribute('data-color');
                counts[color]++;
            });

            if (storedDots.length === 0) {
                box.setAttribute('data-accepted-color', '');
            }

            // Update internal group text indicators (dot + number matching current box contents)
            ['red', 'blue', 'green'].forEach(color => {
                const row = box.querySelector('.' + color + '-group');
                const valSpan = row.querySelector('.count-val');
                if (counts[color] > 0) {
                    valSpan.textContent = counts[color];
                    row.style.display = 'flex';
                } else {
                    row.style.display = 'none';
                }
            });

            // Filter out any dot currently held and moved by the cursor/finger
            const staticStoredDots = storedDots.filter(dot => dot !== activeDot);

            if (staticStoredDots.length > 0) {
                // Ensure exactly ONE static dot is kept visible in the box container context
                const representative = staticStoredDots[0];
                representative.style.display = 'block';

                const dotWidth = parseInt(representative.style.width) || 40;
                const dotHeight = parseInt(representative.style.height) || 40;
                const targetLeft = boxLeft + (boxWidth / 2) - (dotWidth / 2);
                const targetTop = boxTop + (boxHeight / 2) - (dotHeight / 2);

                representative.style.left = targetLeft + "px";
                representative.style.top = targetTop + "px";

                if (representative.setOffsets) {
                    representative.setOffsets(targetLeft, targetTop);
                }

                // Hide all remaining duplicate static dots contained in this sandbox slot
                for (let i = 1; i < staticStoredDots.length; i++) {
                    staticStoredDots[i].style.display = 'none';
                }
            }
        });
    }

    document.querySelectorAll('.draggable-dot').forEach(dot => {
        let active = false;
        let currentX = parseInt(dot.style.left) || 0;
        let currentY = parseInt(dot.style.top) || 0;
        let initialX;
        let initialY;
        let xOffset = currentX;
        let yOffset = currentY;
        let safeLeft = currentX;
        let safeTop = currentY;
        let safeBoxId = null;

        dot.setOffsets = function(x, y) {
            xOffset = x;
            yOffset = y;
            currentX = x;
            currentY = y;
        };

        function dragStart(e) {
            if (dot.style.display === 'none') return;

            activeDot = dot;
            active = true;

            safeLeft = parseInt(dot.style.left) || 0;
            safeTop = parseInt(dot.style.top) || 0;
            safeBoxId = dot.getAttribute('data-stored-in') || null;

            const clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
            
            initialX = clientX - xOffset;
            initialY = clientY - yOffset;

            updateGame();
        }

        function dragMove(e) {
            if (active) {
                const clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;

                currentX = clientX - initialX;
                currentY = clientY - initialY;

                xOffset = currentX;
                yOffset = currentY;

                dot.style.left = currentX + "px";
                dot.style.top = currentY + "px";

                updateGame();
            }
        }

        function dragEnd() {
            if (!active) return;
            active = false;
            activeDot = null;

            const dotRect = dot.getBoundingClientRect();
            const dotCenterX = dotRect.left + dotRect.width / 2;
            const dotCenterY = dotRect.top + dotRect.height / 2;

            let droppedInBox = null;
            document.querySelectorAll('.storage-box').forEach(box => {
                const boxRect = box.getBoundingClientRect();
                if (
                    dotCenterX >= boxRect.left &&
                    dotCenterX <= boxRect.right &&
                    dotCenterY >= boxRect.top &&
                    dotCenterY <= boxRect.bottom
                ) {
                    droppedInBox = box;
                }
            });

            if (droppedInBox) {
                const boxColor = droppedInBox.getAttribute('data-accepted-color');
                const dotColor = dot.getAttribute('data-color');
                const boxId = droppedInBox.getAttribute('data-box-id');

                if (safeBoxId === boxId) {
                    dot.setAttribute('data-stored-in', boxId);
                } else if (boxColor === "" || boxColor === dotColor) {
                    droppedInBox.setAttribute('data-accepted-color', dotColor);
                    dot.setAttribute('data-stored-in', boxId);
                } else {
                    // Sorting mismatch: Snap back to original safe layout coordinate
                    dot.style.left = safeLeft + "px";
                    dot.style.top = safeTop + "px";
                    dot.setOffsets(safeLeft, safeTop);
                    if (safeBoxId) {
                        dot.setAttribute('data-stored-in', safeBoxId);
                    } else {
                        dot.removeAttribute('data-stored-in');
                    }
                }
            } else {
                // Dragged out entirely
                dot.removeAttribute('data-stored-in');
            }

            updateGame();
        }

        // Mouse listeners
        dot.addEventListener("mousedown", dragStart);
        document.addEventListener("mousemove", dragMove);
        document.addEventListener("mouseup", dragEnd);

        // Touch listeners
        dot.addEventListener("touchstart", dragStart);
        document.addEventListener("touchmove", dragMove);
        document.addEventListener("touchend", dragEnd);
    });

    updateGame();
</script>
